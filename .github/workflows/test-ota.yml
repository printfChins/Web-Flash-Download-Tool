# [V1.2 手機修正 修改] OTA 協議、手機觸控與桌面操作回歸驗證。
name: Test BLE OTA
on:
  pull_request:
  push:
    branches: ["main", "feat/ble-ota-v1.2", "fix/mobile-controls-v1.2"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check
      - run: npm run test:ui
